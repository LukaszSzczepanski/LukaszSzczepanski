
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Strona główna</title>

<style>
* {
    box-sizing: border-box;
}


body {
    margin: 0;
    padding: 0;
    font-family: Arial;
}

.strona {
    width: 100%;
    height: 100vh;
    margin: 0;
    border: none;
    display: grid;
    grid-template-columns: 1fr 2fr 1fr;
    grid-template-rows: 15% 70% 15%;
}


header {
    grid-column: 1 / 4;
    border-bottom: 5px solid black;
    text-align: center;
}

.lewy, .srodek, .prawy {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-right: 5px solid black;
    padding: 10px;
}

.prawy {
    border-right: none;
}

footer {
    grid-column: 1 / 4;
    border-top: 5px solid black;
    text-align: center;
    padding: 15px;
}

a {
    margin: 10px;
}
</style>
</head>

<body>

<div class="strona">

<header>
<h2>STRONA GŁÓWNA</h2>
</header>

<div class="lewy">

</div>

<div class="srodek">

<div class="prawy">

<footer>

wykonana przez Łukasza Szczepańskiego
</footer>

</div>

</body>
</html>
